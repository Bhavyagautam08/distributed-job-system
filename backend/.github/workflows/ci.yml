name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:
    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: distributed_jobs

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d distributed_jobs"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


    env:

      DATABASE_URL:
        postgresql://postgres:postgres@localhost:5432/distributed_jobs

      UPSTASH_REDIS_REST_URL:
        https://example.upstash.io

      UPSTASH_REDIS_REST_TOKEN:
        ci-test-token

      RATE_LIMIT_WINDOW_SECONDS:
        60

      RATE_LIMIT_MAX_REQUESTS:
        100

      JOB_MAX_ATTEMPTS:
        3

      BACKOFF_BASE_MS:
        1000

      BACKOFF_MAX_MS:
        30000

      WORKER_ID:
        ci-worker

      WORKER_SHUTDOWN_TIMEOUT_MS:
        30000


    steps:

      - name:
          Checkout

        uses:
          actions/checkout@v4


      - name:
          Setup Node

        uses:
          actions/setup-node@v4

        with:
          node-version:
            22

          cache:
            npm


      - name:
          Install dependencies

        run:
          npm ci


      - name:
          Run database migration

        run:
          npm run migrate


      - name:
          Run tests

        run:
          npm test